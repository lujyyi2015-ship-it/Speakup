<style>
:root{--bg:#eef3f8;--surface:#fff;--ink:#12233d;--muted:#5b6b82;--line:#cfd9e6;--accent:#12233d;--accent-ink:#fff;--mark:#ffc933;--good:#1b7f4b;--goodbg:#dcf3e6;--bad:#b3261e;--badbg:#fbe0dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1726;--surface:#17233a;--ink:#e8eef8;--muted:#94a3bb;--line:#2c3b57;--accent:#ffc933;--accent-ink:#12233d;--good:#6fdca2;--goodbg:#14382b;--bad:#ff9a92;--badbg:#431d1a}}
:root[data-theme="dark"]{--bg:#0e1726;--surface:#17233a;--ink:#e8eef8;--muted:#94a3bb;--line:#2c3b57;--accent:#ffc933;--accent-ink:#12233d;--good:#6fdca2;--goodbg:#14382b;--bad:#ff9a92;--badbg:#431d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:24px 18px 56px}
h1{font-size:clamp(1.9rem,7vw,2.7rem);line-height:1.08;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:24px 0 8px}
.sub,.hint{color:var(--muted);margin:0 0 14px}
.brand{position:relative;isolation:isolate;text-align:center;margin:6px 0 10px}
.logo{display:block;width:250px;max-width:72%;height:auto;margin:0 auto;animation:logoin .7s ease both}
.lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:block}
@keyframes logoin{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
.vc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.list{display:grid;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--ink);font:inherit;cursor:pointer}
.card:hover:not([disabled]){border-color:var(--ink)}
.card[disabled]{opacity:.55;cursor:not-allowed}
.card b{display:block;font-size:1.1rem}.card span{color:var(--muted);font-size:.95rem}
.link{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:6px 0;text-decoration:underline}
.box{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.box.ok{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--mark)}
.btn{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin:0 6px 8px 0}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lb{color:var(--muted)}
.q{font-weight:600;font-size:1.1rem;margin:16px 0 6px}
.opts{display:grid;gap:8px;margin:0 0 10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.opt.good{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
audio{width:100%;margin:8px 0}
textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical;margin:8px 0}
.card:focus-visible,.btn:focus-visible,.opt:focus-visible,.link:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input#un,input#pw{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-top:4px}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.popbox{background:var(--bg);color:var(--ink);border-radius:16px;padding:18px;max-width:460px;width:100%;max-height:85vh;overflow:auto}
.w{padding:0 2px;border-radius:4px}.w.on{background:var(--mark);color:#12233d}.w.done{color:var(--muted)}.script{font-size:1.25rem;line-height:1.8}
</style>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>

sayed:{n:"Sayed Abdelaziz",info:"44 years old. Bachelor of Physical Education. 24 years of experience repairing air conditioners, fridges and washing machines. Sales representative and sales benefits collector, rank 1 driver, and supervisor of maintenance and architecture work. Married with a family of five.",d:[
["Introducing myself",["My name is Sayed. I am 44. I repair air conditioners. I have 24 years of experience.","I’m Sayed, and I’m 44 years old. I repair air conditioners, fridges and washing machines, and I’ve been doing this for twenty-four years.","Let me introduce myself. I’m Sayed, a 44-year-old technician with twenty-four years of experience in repairing air conditioners, refrigerators and washing machines."],"How many years of experience does Sayed have?",["14","24","44"],1,"Introduce yourself in your own words: your name, age, job and years of experience.","Hello, my name is Sayed. I am 44 years old. I repair air conditioners, fridges and washing machines. I have twenty-four years of experience, and I enjoy helping my customers."],
["With a customer",["Good morning. What is the problem? The washing machine makes a loud noise. I will check it.","Good morning. What seems to be the problem with your washing machine? It makes a loud noise, so I will check it today.","Good morning. Could you describe the problem with your washing machine? It makes a loud noise when it spins, so I’ll inspect it and explain what needs repairing."],"What is the problem?",["It is too cold","It makes a loud noise","It does not turn on"],1,"Talk to a customer about a problem with their fridge or air conditioner, and say what you will do.","Good morning. What is the problem with your washing machine? It makes a loud noise. I will check it today and explain what needs to be repaired."],
["My family",["I am married. We are five in my family. We eat lunch together on Friday.","I’m married and I have a family of five. We live together, and on Fridays we always have lunch together.","I’m married with three children, so there are five of us in the family. Family time is important to me, so we have lunch together every Friday."],"How many people are in the family?",["3","5","7"],1,"Talk about your family and what you do together.","I am married and I have a family of five. We live together in a small flat. On Friday we have lunch together, and it is my favourite time of the week."],
["Sales and payments",["I am a sales man. Please pay half today. Pay the other half next month.","I’m also a sales representative. Please pay half the price today and the other half next month.","As a sales representative, I offer flexible payment. You may pay half of the price today and settle the remaining half next month."],"When is the second half paid?",["Today","Next month","Next year"],1,"Explain a price to a customer and ask them to pay.","I am also a sales representative. I visit customers and collect payments. Please pay half today and the other half next month."],
["Leading my team",["I am the team supervisor. Please fix the lights. Finish before five o’clock.","I supervise the maintenance team. Today we paint the building and fix the lights, and the work must be finished before five o’clock.","As the maintenance supervisor, I expect the team to paint the building and repair the lights today, and to complete everything before five o’clock."],"When must the work be finished?",["Before three","Before five","Before seven"],1,"Give your team three instructions for today’s work.","I supervise the maintenance team. Today we paint the building and fix the lights. Please finish all the work before five o’clock."]]},
nermeen:{n:"Nermeen Sayed",info:"16 years old. Studying in the technical department at high school. She always hoped to join a flight or airways academy but could not achieve it. She has decided to improve her spoken English.",d:[
["Introducing myself",["My name is Nermeen. I am sixteen. I want to improve my spoken English.","I’m Nermeen Sayed and I’m sixteen. I study in the technical department, and I want to improve my spoken English.","Let me introduce myself. I’m Nermeen Sayed, a sixteen-year-old student in the technical department at high school, determined to improve my spoken English."],"What does Nermeen want to improve?",["Her maths","Her spoken English","Her drawing"],1,"Introduce yourself and say why you want to improve your English.","Hello, my name is Nermeen Sayed. I am sixteen years old. I study in the technical department at high school, and I want to improve my spoken English."],
["My dream",["I like planes. My dream is to join an airline academy.","I’ve always dreamed of joining an airline academy. I couldn’t do it, but I still love aviation.","I have always dreamed of joining an airline academy. Although I was unable to, I haven’t given up on my passion for aviation."],"What has Nermeen always dreamed of?",["Joining an airline academy","Becoming a teacher","Studying medicine"],0,"Describe your dream and how you feel about it today.","I have always dreamed of joining an airline academy. I could not do it, but I still love aviation and I have not given up."],

  unsubs.push(fsd.collection("comments").onSnapshot(once(function(q){cm={};q.docs.forEach(function(d){cm[d.id]=d.data()})}),err));
 }else{
  unsubs.push(fsd.doc("progress/"+u).onSnapshot(once(function(sn){if(sn.exists)prog[u]=sn.data();else delete prog[u]}),err));
  for(var n=1;n<=TD(u);n++)(function(k){unsubs.push(fsd.doc("comments/"+k).onSnapshot(once(function(sn){if(sn.exists)cm[k]=sn.data();else delete cm[k]}),err))})(u+"_"+n);
 }
 setTimeout(begin,6000);
}
(function(){
 if(typeof firebase==="undefined"||cfg.apiKey.indexOf("PASTE")===0){app.innerHTML='<h1>Setup needed</h1><p class="sub">Open this file in a text editor and paste your Firebase settings near the top of the script, then upload it again.</p>';return}
 firebase.initializeApp(cfg);auth=firebase.auth();fsd=firebase.firestore();initDb();
 auth.onAuthStateChanged(function(user){
  unsubs.forEach(function(f){f()});unsubs=[];started=false;prog={};cm={};
  if(!user){loginView();return}
  var u=(user.email||"").split("@")[0];
  if(u==="teacher"){isT=true;who=null}else if(P[u]){isT=false;who=u}else{auth.signOut();return}
  startData(u);
 });
})();
